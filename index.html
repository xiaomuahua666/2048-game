<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2048 游戏</title>
    <link rel="icon" href="src/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="src/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="src/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#faf8ef">
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <main id="game-shell">
        <div id="game-container">
            <div class="header">
                <h1>2048</h1>
                <div class="score-container" aria-live="polite">
                    <div class="score-title">分数</div>
                    <div id="score">0</div>
                </div>
            </div>
            <div id="game-board" aria-label="2048 游戏棋盘"></div>
            <div id="game-over-screen" role="dialog" aria-modal="true" aria-labelledby="game-message">
                <span id="game-message"></span>
                <button class="new-game-button" id="new-game-button-overlay">再玩一次</button>
            </div>
        </div>
        <div class="button-row">
            <button class="new-game-button" id="new-game-button-main">新游戏</button>
            <button class="new-game-button auto-play-button" id="auto-play-button">自动游玩 (AI)</button>
        </div>
        <details class="notes">
            <summary>详细信息</summary>
            <ul>
                <li><strong>操作</strong>：方向键或滑动棋盘；「自动游玩」由本机 AI 引擎接管，切到后台也会继续运行。</li>
                <li><strong>后台挂机</strong>：若标签页被系统回收，切回时会自动恢复棋局并继续；手动刷新则始终全新开局。桌面 Chrome 可在 设置 → 性能 → 内存节省程序 中把本站加入"始终保持活动状态"，减少回收。</li>
                <li><strong>离线</strong>：首次访问后所有内容缓存到本机，断网可正常游玩。</li>
                <li><strong>偶尔的几秒等待</strong>：开启自动游玩时的引擎初始化、残局时的深度思考，均属正常，算完即走。</li>
            </ul>
        </details>
    </main>
    <script src="src/game-core.js"></script>
    <script src="src/ai.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
