<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2048 游戏</title>
    <link rel="icon" href="src/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="src/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="src/apple-touch-icon.png">
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <main id="game-shell">
        <div id="game-container">
            <div class="header">
                <h1>2048</h1>
                <div class="score-container" aria-live="polite">
                    <div class="score-title">分数</div>
                    <div id="score">0</div>
                </div>
            </div>
            <div id="game-board" aria-label="2048 游戏棋盘"></div>
            <div id="game-over-screen" role="dialog" aria-modal="true" aria-labelledby="game-message">
                <span id="game-message"></span>
                <button class="new-game-button" id="new-game-button-overlay">再玩一次</button>
            </div>
        </div>
        <div class="button-row">
            <button class="new-game-button" id="new-game-button-main">新游戏</button>
            <button class="new-game-button auto-play-button" id="auto-play-button">自动游玩 (AI)</button>
        </div>
        <details class="notes">
            <summary>使用说明</summary>
            <ul>
                <li><strong>打开页面</strong>：只加载游戏本体（约 40KB），AI 引擎不会加载。</li>
                <li><strong>首次点「自动游玩」</strong>：需要下载并初始化 AI 引擎（WebAssembly，约 20KB 下载 + 128MB 内存），会停顿几秒才开始走棋，属正常现象。</li>
                <li><strong>点「停止游玩」</strong>：AI 引擎会被卸载释放内存；再次开启需重新初始化，同样会停顿几秒。</li>
                <li><strong>切到后台</strong>：自动游玩会继续运行；但刷新或关闭页面后棋盘重置、AI 默认关闭。</li>
                <li><strong>手动操作</strong>：方向键或滑动棋盘，无任何额外加载。</li>
            </ul>
        </details>
    </main>
    <script src="src/game-core.js"></script>
    <script src="src/ai.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
